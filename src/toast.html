<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;}
.t{position:absolute;inset:4px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;color:#e8eaf0;
  background:linear-gradient(135deg,#1b1f28,#0d0f13);border:1px solid #2c313c;box-shadow:0 10px 30px rgba(0,0,0,.6);
  animation:in .45s cubic-bezier(.2,.9,.3,1.15) both, out .4s ease-in both;animation-delay:0s, var(--out);}
.t::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,#ff4d5e);}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px 10px 16px;flex:1;}
.ico{width:64px;height:64px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:2.1rem;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),transparent 60%),var(--cbg,#2a1418);box-shadow:inset 0 0 0 2px var(--c,#ff4d5e);
  animation:pop .6s .25s cubic-bezier(.2,1.6,.4,1) both;}
.tx{min-width:0;flex:1;}
.k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c,#ff4d5e);}
.n{font-size:15.5px;font-weight:800;margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d{font-size:12.5px;color:#aab1bf;line-height:1.3;max-height:2.6em;overflow:hidden;}
.f{font-size:11px;color:#6f7685;margin-top:3px;}
.b{display:flex;gap:8px;padding:0 14px 12px 16px;}
.b button{flex:1;border:1px solid #39404d;background:#1f242e;color:#e8eaf0;border-radius:8px;padding:7px 8px;font-weight:700;font-size:12.5px;cursor:pointer;}
.b button.p{background:var(--c,#ff4d5e);border-color:var(--c,#ff4d5e);color:#fff;}
.b button:hover{filter:brightness(1.15);}
.t.small .row{padding:9px 12px 8px 14px;gap:10px;}
.t.small .ico{width:46px;height:46px;font-size:1.5rem;border-radius:9px;}
.t.small .n{font-size:14px;}
.t.small .d{font-size:12px;max-height:1.35em;}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);transform:translateX(-100%);animation:shine 1.4s .4s ease-out;}
/* neues Design: Glas in den Farben der Farbwelt, Leuchtrand im Farbverlauf */
.neu .t{border:0;border-radius:18px;background:linear-gradient(160deg,var(--pb1),var(--pb2));box-shadow:0 12px 32px rgba(0,0,0,.55);font-family:"Segoe UI",system-ui,sans-serif;}
.neu .t::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--p3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85;}
.neu .t::before{width:3px;top:16px;bottom:16px;border-radius:0 3px 3px 0;background:linear-gradient(var(--p1),var(--p2));box-shadow:0 0 12px var(--p2);}
.neu .ico{border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.14),transparent 60%),rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px var(--c,var(--p2)),0 0 18px color-mix(in srgb,var(--c,var(--p2)) 45%,transparent);}
.neu .k{color:var(--c);}
.neu .b button{border-radius:999px;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07);}
.neu .b button.p{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;}
@keyframes in{from{transform:translateX(110%);opacity:0}}
@keyframes out{to{transform:translateX(110%);opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes shine{to{transform:translateX(100%)}}
</style></head><body>
<div class="t" id="t"><div class="shine"></div><div class="row"><div class="ico" id="ico"></div><div class="tx"><div class="k" id="k"></div><div class="n" id="n"></div><div class="d" id="d"></div><div class="f" id="f"></div></div></div><div class="b" id="b"></div></div>
<script>
const t = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const COLORS = {leicht: ['#7bd88f', '#13261a'], mittel: ['#4ea8de', '#11202e'], schwer: ['#9b5de5', '#1e1530'], legendär: ['#f4c150', '#2e2410']};
// neues Design: Farben der Farbwelt (Erfolge behalten ihre Schwierigkeitsfarbe)
const PAL = {ozean: ['#3ee0ff', '#3b6fff', '#8a5cff', '#0b1838', '#06102a'], aurora: ['#ff8a5c', '#ff2e8a', '#7a5cff', '#1b1038', '#0e1030'],
             glut: ['#ffb547', '#ff4d3d', '#c2185b', '#221012', '#0f0809'], gift: ['#c6ff5c', '#1fd6a0', '#2b7fff', '#0c1f1e', '#061212'],
             sakura: ['#ff9ad5', '#b98bff', '#7fc8ff', '#2a1842', '#170e2b'], rot: ['#ff8a3d', '#ff2d48', '#a3122b', '#1e0b10', '#0b0506']};
const look = t.look && PAL[t.look.palette] ? PAL[t.look.palette] : null;
let [c, cbg] = COLORS[(t.color || '').toLowerCase()] || [t.colorHex || '#ff4d5e', '#2a1418'];
if (look) {
  if (!COLORS[(t.color || '').toLowerCase()]) { c = look[1]; cbg = look[3]; }
  document.body.classList.add('neu');
  const r = document.documentElement.style;
  r.setProperty('--p1', look[0]); r.setProperty('--p2', look[1]); r.setProperty('--p3', look[2]); r.setProperty('--pb1', look[3]); r.setProperty('--pb2', look[4]);
}
const box = document.getElementById('t');
if (t.small) box.classList.add('small');
box.style.setProperty('--c', c); box.style.setProperty('--cbg', cbg); box.style.setProperty('--out', ((t.seconds || 7) - .45) + 's');
document.getElementById('ico').textContent = t.icon || '🏅';
document.getElementById('k').textContent = t.title || '';
document.getElementById('n').textContent = t.name || '';
document.getElementById('d').textContent = t.text || '';
document.getElementById('f').textContent = t.foot || '';
const b = document.getElementById('b');
(t.buttons || []).forEach((x, i) => { const el = document.createElement('button'); el.textContent = x.label; if (i === 0) el.className = 'p'; el.onclick = () => toastApi.act(x.action); b.append(el); });
if (!(t.buttons || []).length) b.remove();
// Ton: kurzer heller Akkord wie bei Steam
try {
  const ac = new AudioContext(), now = ac.currentTime;
  const notes = t.quiet ? [880] : t.kind === 'match' ? [523.25, 659.25, 783.99] : t.small ? [783.99, 1046.5] : [659.25, 987.77, 1318.5];
  const vol = t.quiet ? .05 : t.small ? .08 : .12;
  notes.forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + i * .09); g.gain.linearRampToValueAtTime(vol, now + i * .09 + .02); g.gain.exponentialRampToValueAtTime(.001, now + i * .09 + .6);
    o.connect(g).connect(ac.destination); o.start(now + i * .09); o.stop(now + i * .09 + .65);
  });
} catch (e) { /* ohne Ton */ }
</script></body></html>
